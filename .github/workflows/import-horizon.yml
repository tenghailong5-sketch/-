name: Import Horizon upstream

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-horizon.yml'

permissions:
  contents: write
  workflows: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import upstream source
        run: |
          git clone --depth 1 https://github.com/Thysrael/Horizon.git /tmp/horizon
          rsync -a --exclude='.git/' /tmp/horizon/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
          else
            git commit -m "Import Horizon upstream source"
            git push
          fi
